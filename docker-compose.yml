services:
  # ==========================================
  # Service 1: PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: pss_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personalproject}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-personalproject}"]
      interval: 3s
      timeout: 5s
      retries: 5

  # ==========================================
  # Service 2: ASP.NET Core Web API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pss_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-personalproject};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY:-DevDefaultSecretKeyMustBe32CharactersOrLonger!}
      - Jwt__Issuer=${JWT_ISSUER:-PersonalProject}
      - Jwt__Audience=${JWT_AUDIENCE:-PersonalProjectUsers}
    depends_on:
      db:
        condition: service_healthy

# ==========================================
# Persistent Storage Volumes
# ==========================================
volumes:
  postgres_data:
